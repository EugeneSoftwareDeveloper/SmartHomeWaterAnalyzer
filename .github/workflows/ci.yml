name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Новый пуш отменяет предыдущий прогон той же ветки: раннер платный, а
# результат устаревшего прогона всё равно никому не нужен. Релизы сюда не
# попадают — у них свой workflow по тегу.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      # Раннер приезжает с десятками гигабайт тулчейнов, которые
      # Flutter-сборке не нужны, и места остаётся впритык. Кончается оно
      # не на шагах сборки, а на служебных — сохранении кэша, записи
      # логов, — и выглядит это как «упал билд» при зелёных проверках.
      # Поэтому чистим заранее и печатаем df до и после.
      - name: Освободить место на раннере
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Java (для Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Версия запинена намеренно. На `channel: stable` без версии раннер берёт
          # свежий stable, и когда тот уехал на Dart 3.13, build_runner упал:
          # транзитивный `analyzer` из pubspec.lock не знает новых AST-узлов
          # («Missing implementation of visitDotShorthandPropertyAccess»).
          # Держим ту же версию, на которой ведётся разработка; поднимать —
          # осознанно, вместе с `flutter pub upgrade`.
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # Ширину берёт из analysis_options.yaml (page_width: 100) — специально без флага -l,
      # чтобы CI и локальный `dart format` не могли разойтись.
      #
      # Шаг блокирующий: раньше стоял continue-on-error, и проверка молча пропускала
      # 47 неотформатированных файлов из 64 — то есть создавала видимость контроля.
      #
      # Сгенерированное исключено тем же списком, что и в analyzer'е: предыдущий шаг
      # только что перегенерировал *.g.dart и l10n, и требовать от генератора нашей
      # ширины строки — значит ронять сборку из-за файлов, которые никто не пишет руками.
      - name: Verify formatting
        run: |
          find lib test -name '*.dart' \
            ! -name '*.g.dart' \
            ! -name '*.freezed.dart' \
            ! -path 'lib/l10n/generated/*' \
            -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      # Раннер приезжает с десятками гигабайт тулчейнов, которые
      # Flutter-сборке не нужны, и места остаётся впритык. Кончается оно
      # не на шагах сборки, а на служебных — сохранении кэша, записи
      # логов, — и выглядит это как «упал билд» при зелёных проверках.
      # Поэтому чистим заранее и печатаем df до и после.
      - name: Освободить место на раннере
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc
          sudo rm -rf /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          # Та же версия, что в job'е analyze-and-test — см. комментарий выше.
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs


      - run: flutter build apk --release --split-per-abi
      # Google Play требует поддержки 16 KB page size от приложений под
      # Android 15+. Выравнивание нативных библиотек даёт тулчейн, а не
      # код проекта, поэтому сломать его может обновление зависимости с
      # нативной частью — молча и без падения сборки. У проекта такие
      # есть (drift/sqlite3, BLE), так что проверка не теоретическая.
      - name: Выравнивание нативных библиотек на 16 KB
        run: python3 tools/check_so_alignment.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk


      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
